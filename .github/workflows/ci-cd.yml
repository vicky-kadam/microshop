name: microshop CI/CD

on:
  push:
    branches: [ "main" ]

env:
  DOCKERHUB_USER: vickykadam

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-test-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ user-service, product-service, order-service, api-gateway ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}

  deploy:
    needs: [ prepare, build-test-push ]
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Cluster check
        run: |
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Namespace aur Secret
        run: |
          kubectl create namespace microshop --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic db-secret -n microshop --from-literal=MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}' --dry-run=client -o yaml | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Image tag lagao
        run: |
          $user = "${{ env.DOCKERHUB_USER }}"
          $tag = "${{ needs.prepare.outputs.tag }}"
          Get-ChildItem k8s -Filter *.yml | ForEach-Object {
            (Get-Content $_.FullName) -replace "image: $user/([a-z-]+):1", "image: $user/`$1:$tag" | Set-Content $_.FullName
          }

      - name: Apply
        run: |
          kubectl apply -n microshop -f k8s/
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Ready hone tak wait
        run: |
          kubectl rollout status statefulset/mysql -n microshop --timeout=300s
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($d in 'user-service','product-service','order-service','api-gateway') {
            kubectl rollout status deployment/$d -n microshop --timeout=300s
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Fail par debug info
        if: failure()
        run: |
          kubectl get pods -n microshop
          kubectl describe pods -n microshop | Select-Object -Last 60
          exit 0