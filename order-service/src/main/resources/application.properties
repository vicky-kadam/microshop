spring.application.name=order-service
server.port=${SERVER_PORT:8083}

# Sab kuch env variable se aata hai. K8s mein ConfigMap/Secret deta hai. Local ke liye default niche hain.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Dusri services ke address (K8s mein Service ka DNS naam)
services.user-url=${USER_SERVICE_URL:http://localhost:8081}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}

# K8s probes ke liye
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
