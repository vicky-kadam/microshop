spring.application.name=product-service
server.port=${SERVER_PORT:8082}

# Sab kuch env variable se aata hai. K8s mein ConfigMap/Secret deta hai. Local ke liye default niche hain.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# K8s probes ke liye
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
